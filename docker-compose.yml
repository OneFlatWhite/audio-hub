services:
  audio-hub:
    build: .
    container_name: audio-hub
    restart: unless-stopped
    network_mode: host          # 与 qb1 一致，直接 localhost:8085
    environment:
      - TZ=Asia/Shanghai
      - PUID=0                  # 见 PRD §6.3 权限方案 A
      - PGID=0
      - AUDIO_HUB_CONFIG=/config/config.yaml
      - AUDIO_HUB_SECRETS_KEY=/config/secrets.key
      # 监听端口在 config.yaml 的 web.port（默认 8090，python -m audio_hub 读取）；
      # qb 连接参数在 /downloaders 页或 config.yaml 的 qbittorrent 种子段。
      # v0.6 前的 QB_* / HUB_* 环境变量是死变量（代码从未读取），已删除。
    volumes:
      - ./config:/config
      - /volume1/musiclab:/musiclab       # 必须与 qb1 容器内路径一致
      - /volume1/audiolab:/audiolab       # 有声书路由目标（v0.2+）
