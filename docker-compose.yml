services:
  audio-hub:
    build: .
    container_name: audio-hub
    restart: unless-stopped
    network_mode: host          # 与 qb1 一致，直接 localhost:8085
    environment:
      - TZ=Asia/Shanghai
      - PUID=0                  # 见 PRD §6.3 权限方案 A
      - PGID=0
      - AUDIO_HUB_CONFIG=/config/config.yaml
      - AUDIO_HUB_SECRETS_KEY=/config/secrets.key
      # 监听端口在 config.yaml 的 web.port（默认 8090，python -m audio_hub 读取）；
      # qb 连接参数在 /downloaders 页或 config.yaml 的 qbittorrent 种子段。
      # v0.6 前的 QB_* / HUB_* 环境变量是死变量（代码从未读取），已删除。
    volumes:
      - ./config:/config
      - /volume1/musiclab:/musiclab       # 必须与 qb1 容器内路径一致
      - /volume1/audiolab:/audiolab       # 有声书路由目标（v0.2+）

  re0-browser:
    build:
      context: ./docker/re0-browser
    container_name: audio-hub-re0-browser
    restart: unless-stopped
    profiles:
      - re0
    environment:
      PUID: "${RE0_PUID:?run scripts/init_re0_browser.py first}"
      PGID: "${RE0_PGID:?run scripts/init_re0_browser.py first}"
      TZ: Asia/Shanghai
      CUSTOM_USER: "${RE0_GUI_USER:?run scripts/init_re0_browser.py first}"
      PASSWORD: "${RE0_GUI_PASSWORD:?run scripts/init_re0_browser.py first}"
      CHROME_CLI: >-
        --load-extension=/opt/violentmonkey
        --remote-debugging-address=0.0.0.0
        --remote-debugging-port=9222
        --no-first-run
        --disable-session-crashed-bubble
        https://re0.me/
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:9222:9222"
    volumes:
      - ./config/re0-browser:/config
    shm_size: "1gb"
